name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Safety net: if the project was uploaded as a .zip instead of unpacked, unpack it.
      # Only runs when no settings.gradle is present yet, so it never creates duplicates.
      - name: Unpack zip if project is not unpacked
        shell: bash
        run: |
          if [ -z "$(find . -name settings.gradle -not -path './.git/*' -print -quit)" ]; then
            find . -name '*.zip' -not -path './.git/*' -print0 | while IFS= read -r -d '' z; do
              echo "Unzipping: $z"
              unzip -oq "$z" -d "$(dirname "$z")/unzipped" || echo "Could not unzip $z (skipping)"
            done
          fi

      # Find the project folder (the shallowest one containing settings.gradle).
      - name: Locate project
        id: find
        shell: bash
        run: |
          FILE=$(find . -name settings.gradle -not -path './.git/*' -not -path '*/build/*' \
            | awk '{ n = gsub("/", "/"); print n, $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -z "$FILE" ]; then
            echo "::error::No settings.gradle found in the repo. Files present:"
            find . -not -path './.git/*' | head -50
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      # NeoForge 1.21.1 needs Java 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # This project has no Gradle wrapper (no gradlew), so install Gradle directly.
      # ModDevGradle 2.x needs Gradle 8.8 or newer.
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: luckyblockmod-1.21.1-neoforge
          path: |
            ${{ steps.find.outputs.dir }}/build/libs/*.jar
            !${{ steps.find.outputs.dir }}/build/libs/*-sources.jar
            !${{ steps.find.outputs.dir }}/build/libs/*-javadoc.jar
          if-no-files-found: error
